name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reject generated debug JSON
        shell: bash
        run: |
          set -euo pipefail
          if find data/debug data/voiceprints -type f ! -name '.gitkeep' 2>/dev/null | grep -q .; then
            echo 'Generated debug / voiceprint data must not be committed.'
            exit 1
          fi

      - name: Python syntax check
        run: python -m compileall -q app.py core models services ui

      - name: Note heavy validation boundary
        run: echo 'Whisper / pyannote / ffmpeg model execution is intentionally excluded from lightweight CI.'
